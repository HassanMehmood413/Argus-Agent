apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: argus-agent-prod
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail-sa
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          volumeMounts:
            # Promtail config
            - name: config
              mountPath: /etc/promtail
            # Access to pod logs on the node
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            # Access to container logs (Docker/containerd)
            - name: containers-logs
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
        - name: containers-logs
          hostPath:
            path: /var/lib/docker/containers
