apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: argus-agent-prod
  labels:
    app: postgres
type: Opaque
stringData:
  # Database credentials
  POSTGRES_USER: "argus"
  POSTGRES_PASSWORD: "argus-secret-password"  # Change in production!
  POSTGRES_DB: "argus_agent"

  # Connection URL for the agent
  DATABASE_URL: "postgresql+asyncpg://argus:argus-secret-password@postgres-service:5432/argus_agent"
