kind: ServiceAccount
apiVersion: v1
metadata:
  name: argus-agent-service-account
  namespace: argus-agent-prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus-agent-role
  namespace: argus-agent-prod
rules:
  # ============================================
  # READ OPERATIONS (analyzer, monitor, summarizer)
  # ============================================

  # Read pods - needed to get pod names, status, for log correlation
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Read pod logs - needed for log analysis
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  # Read services/endpoints - needed to discover internal services
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]

  # Read events - needed for context about what's happening in cluster
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

  # Read deployments - needed to check current state
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]

  # ============================================
  # WRITE OPERATIONS (executor module)
  # ============================================

  # Delete pods - needed to trigger restarts (deployment will recreate)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]

  # Scale deployments - needed to increase/decrease replicas
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]

  # ============================================
  # CONFIG ACCESS
  # ============================================

  # Read configmaps - needed for app configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

  # Read specific secrets only (not all secrets)
  # This limits blast radius if agent is compromised
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - "agent-secrets"           # Main secrets (OpenAI, Slack, etc.)
      - "db-credentials"          # Database credentials (if needed)

  # ============================================
  # WHAT THIS ROLE CANNOT DO (security boundaries)
  # ============================================
  # - Cannot DELETE deployments (only scale them)
  # - Cannot access secrets other than listed above
  # - Cannot modify RBAC (no privilege escalation)
  # - Cannot access other namespaces
  # - Cannot create new deployments (only scale existing)


---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus-agent-role-binding
  namespace: argus-agent-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus-agent-role
subjects:
  - kind: ServiceAccount
    name: argus-agent-service-account
    namespace: argus-agent-prod
