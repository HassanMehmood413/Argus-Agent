apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-agent-config
  namespace: argus-agent-prod
  labels:
    app: argus-agent
data:
  # Redis
  REDIS_URL: "redis://redis-service:6379/0"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # AI Model
  MODEL: "gpt-4o"
  EMBEDDING_MODEL: "text-embedding-3-small"

  # Qdrant
  QDRANT_URL: "http://qdrant-service:6333"
  QDRANT_COLLECTION: "devops_incidents"

  # Analyzer
  MAX_SIMILAR_INCIDENTS: "3"
  SIMILARITY_THRESHOLD: "0.3"
  MAX_ACTIONS: "3"

  # Approval
  CONFIDENCE_THRESHOLD: "0.7"
  AUTO_APPROVE_RISK_LEVELS: "none,low"
  SLACK_DEFAULT_CHANNEL: "#incidents"
  SLACK_APPROVAL_TIMEOUT_HOURS: "24"

  # Execution
  DEPLOYMENT_TOOL: "kubectl"
  EXECUTION_DRY_RUN: "true"
  EXECUTION_STOP_ON_FAILURE: "true"
  EXECUTION_TIMEOUT_SECONDS: "300"
  EXECUTION_MAX_RETRIES: "3"
  EXECUTION_RETRY_DELAY: "1.0"
  EXECUTION_RETRY_BACKOFF: "2.0"

  # Kubernetes
  K8S_IN_CLUSTER: "true"

  # Jira
  JIRA_PROJECT_KEY: "POST"
  JIRA_POSTMORTEM_ISSUE_TYPE: "Task"
