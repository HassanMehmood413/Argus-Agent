apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-agent-config
  namespace: argus-agent-prod
  labels:
    app: argus-agent
data:
  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # OpenAI Configuration
  MODEL: "gpt-4o"

  # Qdrant Configuration
  QDRANT_URL: "http://localhost:6333"
  QDRANT_COLLECTION: "devops_incidents"

  # Embedding Configuration
  EMBEDDING_MODEL: "text-embedding-3-small"

  # Analyzer Configuration
  MAX_SIMILAR_INCIDENTS: "3"
  SIMILARITY_THRESHOLD: "0.3"
  MAX_ACTIONS: "3"

  # Approval Thresholds
  CONFIDENCE_THRESHOLD: "0.7"
  AUTO_APPROVE_RISK_LEVELS: '["none", "low"]'

  # Slack Configuration
  SLACK_DEFAULT_CHANNEL: "#incidents"
  SLACK_APPROVAL_TIMEOUT_HOURS: "24"

  # Execution Configuration
  DEPLOYMENT_TOOL: "kubectl"
  EXECUTION_DRY_RUN: "false"
  EXECUTION_STOP_ON_FAILURE: "true"
  EXECUTION_TIMEOUT_SECONDS: "300"
  EXECUTION_MAX_RETRIES: "3"
  EXECUTION_RETRY_DELAY: "1.0"
  EXECUTION_RETRY_BACKOFF: "2.0"

  # Kubernetes Configuration
  K8S_IN_CLUSTER: "true"

  # Jira Configuration
  JIRA_PROJECT_KEY: "POST"
  JIRA_POSTMORTEM_ISSUE_TYPE: "Task"
