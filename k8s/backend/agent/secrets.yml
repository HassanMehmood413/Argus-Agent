apiVersion: v1
kind: Secret
metadata:
  name: argus-agent-secrets
  namespace: argus-agent-prod
  labels:
    app: argus-agent
type: Opaque
stringData:
  # Database Configuration (must match postgres-secret)
  DATABASE_URL: "postgresql+asyncpg://argus:argus-secret-password@postgres-service:5432/argus_agent"

  # Redis Configuration
  REDIS_URL: "redis://redis:6379/0"
  REDIS_PASSWORD: ""

  # OpenAI Configuration
  OPENAI_API_KEY: ""

  # Qdrant Configuration
  QDRANT_API_KEY: ""

  # Slack Configuration
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""

  # Jira Configuration
  JIRA_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
