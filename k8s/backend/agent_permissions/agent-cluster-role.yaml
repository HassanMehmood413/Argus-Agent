apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-agent-cluster-role
  labels:
    app: argus-agent
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/status
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get", "list"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/status
      - replicasets
      - replicasets/status
      - statefulsets
      - statefulsets/status
      - daemonsets
      - daemonsets/status
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - services
      - configmaps
      - namespaces
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - nodes
      - nodes/status
    verbs: ["get", "list", "watch"]


  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["patch", "update"]

  - apiGroups: ["apps"]
    resources:
      - deployments/scale
    verbs: ["get", "patch", "update"]

  - apiGroups: [""]
    resources:
      - pods
    verbs: ["delete", "deletecollection"]

  - apiGroups: ["apps"]
    resources:
      - deployments/rollback
    verbs: ["create"]
