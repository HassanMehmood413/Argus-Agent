kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: argus-agent-junior-role-binding
  namespace: argus-agent-dev
subjects:
  - kind: User
    name: junior@company.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: argus-agent-junior-role
  apiGroup: rbac.authorization.k8s.io

---

kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: argus-agent-senior-cluster-role-binding
subjects:
  - kind: User
    name: senior@company.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: argus-agent-senior-cluster-role
  apiGroup: rbac.authorization.k8s.io
