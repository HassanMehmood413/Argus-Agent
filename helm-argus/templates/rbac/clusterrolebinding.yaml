{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helm-argus.fullname" . }}-cluster-role-binding
  labels:
    {{- include "helm-argus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "helm-argus.fullname" . }}-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ include "helm-argus.serviceAccountName" . }}
    namespace: {{ .Values.argus.namespace }}
{{- end }}